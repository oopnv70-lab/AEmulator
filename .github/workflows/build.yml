name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Remove Windows-only gradle java.home property
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APKs
        run: ./gradlew --no-daemon :app:assembleV0003Debug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AEmulator-Debug-APKs
          path: app/build/outputs/apk/v0003/debug/*.apk
